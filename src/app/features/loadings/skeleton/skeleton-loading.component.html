<article class="product-card product-card--skeleton" aria-hidden="true">
  <div class="product-card__image">
    <div class="skeleton-box skeleton-box--image"></div>
  </div>

  <div class="product-card__body">
    <div class="skeleton-box skeleton-box--tag"></div>
    <div class="skeleton-box skeleton-box--title"></div>

    <div class="product-card__fragrance">
      <div class="skeleton-box skeleton-box--line"></div>
      <div class="skeleton-box skeleton-box--line skeleton-box--short"></div>
    </div>

    <div class="product-card__description">
      <div class="skeleton-box skeleton-box--line"></div>
      <div class="skeleton-box skeleton-box--line skeleton-box--medium"></div>
    </div>

    <div class="product-card__price-container">
      <div class="skeleton-box skeleton-box--price"></div>
      <div class="skeleton-box skeleton-box--bulk"></div>
    </div>

    <div class="skeleton-box skeleton-box--weight"></div>
    <div class="skeleton-box skeleton-box--button"></div>
  </div>
</article>
